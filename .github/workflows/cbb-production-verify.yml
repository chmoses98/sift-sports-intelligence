name: CBB production verify (temporary)

# One-off, read-only verification of the LIVE site after the CBB rollout. Lives only on a temporary
# branch; never merged.
on:
  push:
    branches: [claude/cbb-production-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: CBB live checks (Chromium desktop + WebKit iPhone)
        run: node scripts/cbb-production-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-production-verify
          path: shots/
          retention-days: 7
