name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, live-quotes]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build · acceptance (Chromium + WebKit)
    runs-on: ubuntu-latest
    # The gate is the acceptance suite (Chromium and WebKit, four projects) plus the release-configuration suite. On GitHub's runners it has taken
    # 34 to 58 minutes for the suite alone (2026-10-22: a deploy gate was cancelled at exactly 60 minutes, in the release-configuration step, after
    # the acceptance suite had passed). Every test still has to pass; this only keeps a slow runner from killing a gate that is passing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (real NFL fixtures, golden packets, live-quote layer, relay, feed)
        run: npm test
      - name: Production build (relay pointed at the e2e stand-in https://relay.sift.invalid)
        run: npm run build:e2e
      - name: GitHub Pages build check (base path, manifest, service worker, hash routing)
        run: node scripts/check-dist.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Acceptance suite — journey, live market, degraded states, visual, accessibility, smoke
        run: npx playwright test
        env:
          CI: 'true'
      - name: Release configuration — SIFT 2.0 as the default interface (classic addresses redirect, refresh, escape hatch)
        run: |
          npm run build:e2e:default
          npx playwright test -c playwright.default.config.ts
        env:
          CI: 'true'
      - name: Journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  projection-foundation:
    name: Projection Foundation (pf_core) · Python tests + vendoring manifest
    # Required on every pull request and branch push. Skipped inside deploy.yml's reuse of this workflow (push to main, schedule):
    # a research-only library test must never block a SIFT deploy (same rule as pure-contract.yml); it already gated the PR.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/projection_foundation/requirements-pf.txt
      - name: Install the pinned numerical stack
        run: pip install -r research/projection_foundation/requirements-pf.txt
      - name: pf_core is exactly what MANIFEST.json says (the sport repos vendor byte-identical copies)
        working-directory: research/projection_foundation
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          m = json.load(open("pf_core/MANIFEST.json"))
          bad = [f for f, h in m["sha256"].items() if hashlib.sha256(open(f"pf_core/{f}", "rb").read()).hexdigest() != h]
          extra = sorted(set(f for f in os.listdir("pf_core") if f.endswith(".py")) - set(m["sha256"]))
          v = re.search(r'^VERSION = "([^"]+)"', open("pf_core/__init__.py").read(), re.M).group(1)
          print("manifest", m["version"], "VERSION", v, "mismatched", bad, "unlisted", extra)
          sys.exit(1 if bad or extra or v != m["version"] else 0)
          PY
      - name: pf_core, live operation, scorecards and feed-monitor tests
        working-directory: research/projection_foundation
        run: python3 -m pytest tests -q -p no:cacheprovider
