name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, live-quotes]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build · acceptance (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (real NFL fixtures, golden packets, live-quote layer, relay, feed)
        run: npm test
      - name: Production build (relay pointed at the e2e stand-in https://relay.sift.invalid)
        run: npm run build:e2e
      - name: GitHub Pages build check (base path, manifest, service worker, hash routing)
        run: node scripts/check-dist.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Acceptance suite — journey, live market, degraded states, visual, accessibility, smoke
        run: npx playwright test
        env:
          CI: 'true'
      - name: Journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  pure-contract:
    name: PURE contract gate (Python, stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (schema, lineage, ladders, compare, rerun non-leakage with toy models)
        working-directory: pure-contract
        run: python -I -m unittest discover -s tests -v
      - name: Validate example sidecars (v1 and kit interim v0)
        working-directory: pure-contract
        run: |
          python -I pure_gate.py validate --forecasts examples/pure_forecast.v1.example.jsonl --require-v1
          python -I pure_gate.py validate --forecasts examples/kit_interim_v0.example.jsonl
