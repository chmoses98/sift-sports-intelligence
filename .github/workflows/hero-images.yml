name: Hero images

# Turns the reviewed pins (scripts/heroes/pins.json) into the served game-hero photographs
# (public/heroes/<sport>/*.webp) and src/lib/hero/photos.json, with each licence read from Commons, and commits
# them to the branch. Fetched once; the app never loads a photograph from a third party at runtime.
on:
  push:
    branches-ignore: [main, live-quotes]
    paths:
      - scripts/heroes/pins.json
      - scripts/heroes/fetch.mjs
      - .github/workflows/hero-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: convert -list format | grep -i webp || (sudo apt-get update && sudo apt-get install -y webp imagemagick)
      - run: node scripts/heroes/fetch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/heroes src/lib/hero/photos.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Game hero photographs (fetched once from Wikimedia Commons, per scripts/heroes/pins.json)"
          for i in 1 2 3 4 5; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*5)); done
          exit 1
