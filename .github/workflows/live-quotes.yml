name: Live-quote feed
run-name: ${{ github.event_name == 'schedule' && 'Live quotes watchdog' || format('Live quotes loop {0}', inputs.slot || 'a') }}

# The market clock without a server: a runner reads Kalshi's PUBLIC market data (read-only, no
# credential; browsers cannot, Kalshi refuses their Origin) for the games the NFL, NHL and MLB publications list and
# force-pushes one small JSON per game to the `live-quotes` branch every 3 minutes. Sift reads it from
# raw.githubusercontent.com; the app is never rebuilt or redeployed for a price move.
#
# GitHub's scheduler is not dependable for this repository (measured 2026-10-04: the 15:17 deploy cron
# never fired, and a new */5 cron did not start for 40+ minutes), so the loop dispatches its own successor
# (workflow_dispatch from GITHUB_TOKEN is allowed to start a run).
#
# HAND-OVER (docs/ci/QUEUE_ANALYSIS.md, docs/ci/LIVE_QUOTES_RESILIENCE.md). A job used to publish for ~55 minutes and only
# then dispatch its successor, which then had to win a hosted runner. 2026-10-04 to 10-28: 50 of 599 hand-overs waited more
# than 10 minutes and the longest 69, and the feed stood still for exactly that long. Now a job dispatches its successor
# 45 minutes in, into the OTHER concurrency slot (a/b), and keeps publishing until the successor is running AND has published,
# up to a 150 minute cap. A long queue wait therefore costs only the predecessor's runner time, not feed freshness. Because the two
# overlap for a few minutes, the push to `live-quotes` is freshest-wins (a feed is never replaced by an older one) and an overlapping
# publisher waits until the branch is 150 s old, so the Kalshi request rate stays one sweep per cycle. The scheduled run is a
# watchdog: it exits at once unless the feed is more than 10 minutes old, and then restarts the loop. The logic lives in
# scripts/live-quotes/ (handover.mjs, guard.mjs, loop.mjs) and is tested in tests/live/quote-handover.test.ts.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Concurrency slot. The loop alternates a and b so a job and its successor can overlap; leave as a.'
        type: choice
        options: [a, b]
        default: a

permissions:
  contents: write
  actions: write

# One running job per slot; the watchdog has its own group. Never cancel a running loop.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'live-quotes-watchdog' || format('live-quotes-{0}', inputs.slot || 'a') }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish live quotes (overlapping hand-over loop)
    runs-on: ubuntu-latest
    # The loop's own cap is 150 minutes (HANDOVER.capMin); the limit sits above it. Keep them in step (tests/live/quote-handover.test.ts).
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Kalshi public market data (GET only) and publish every 3 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIFT_LOOP_SLOT: ${{ github.event_name == 'schedule' && 'w' || inputs.slot || 'a' }}
        run: node scripts/live-quotes/loop.mjs
      - name: Make sure a successor exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIFT_LOOP_SLOT: ${{ github.event_name == 'schedule' && 'w' || inputs.slot || 'a' }}
        run: node scripts/live-quotes/loop.mjs ensure
