name: Live-quote feed

# The market clock without a server: every 5 minutes a runner reads Kalshi's PUBLIC market data
# (read-only, no credential; browsers cannot, Kalshi refuses their Origin) for the games the NFL
# publication lists, and force-pushes one small JSON per game to the `live-quotes` branch. Sift reads
# it from raw.githubusercontent.com. The app is never rebuilt or redeployed for a price move.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [claude/sift-qa-live-market-mn7bzf]
    paths: [scripts/publish-live-quotes.mjs, scripts/live-quotes/**, .github/workflows/live-quotes.yml]

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: false

jobs:
  publish:
    name: Publish live quotes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Kalshi public market data (GET only)
        run: node scripts/publish-live-quotes.mjs "$RUNNER_TEMP/feed"
      - name: Force-push the feed (single commit, no history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/feed"
          git init -q -b live-quotes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "live quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-quotes
