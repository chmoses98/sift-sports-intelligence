name: Live-score feed probe (evaluation only)

# A read-only probe of the candidate FREE score feeds, run from a GitHub runner (which, unlike the build sandbox, can reach them).
# Modes (set in scripts/live-scores/probe-config.json so a push can start a run; workflow_dispatch needs the workflow on main):
#   once          fetch every candidate once; save the real responses and the terms pages
#   watch         poll the raw scoreboards and log every change
#   verify        run the production adapters and matcher against the real boards and real feeds once, and cross-check scores
#   verify-watch  the same, polling for N minutes through live games: every score/period/clock change per source, latency, accuracy
#   oracle-test   whether the NBA's own scoreboard can be read from the runner (verification only)
#   nba-verify    NBA games in play: SIFT's displayed state vs the NBA scoreboard every 30 s (the evening run); verdicts only
#   live-site     the deployed GitHub Pages site in real Chromium and WebKit (same checks as browser, no local build)
#   browser       the built app in real Chromium and WebKit with real internet: live scores on, screenshots, requests, CORS, console errors
# Results go to the `live-scores-probe` branch for review. Nothing here publishes to SIFT's app, and it is not part of CI.
on:
  push:
    branches: ['claude/live-scores-real']
    paths:
      - 'scripts/live-scores/**'
      - '.github/workflows/live-scores-probe.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'once | watch | verify | verify-watch | browser | live-site | nba-verify | oracle-test (empty: scripts/live-scores/probe-config.json)'
        required: false
        default: ''
      minutes:
        description: 'minutes (watch and nba-verify)'
        required: false
        default: '60'
      tag:
        description: 'suffix for the evidence branch (nba-verify)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: live-scores-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      minutes: ${{ steps.cfg.outputs.minutes }}
      interval: ${{ steps.cfg.outputs.interval }}
      tag: ${{ steps.cfg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live-scores
      - id: cfg
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "minutes=${{ github.event.inputs.minutes }}" >> "$GITHUB_OUTPUT"
            echo "interval=20" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$(node -p "require('./scripts/live-scores/probe-config.json').mode")" >> "$GITHUB_OUTPUT"
            echo "minutes=$(node -p "require('./scripts/live-scores/probe-config.json').minutes")" >> "$GITHUB_OUTPUT"
            echo "interval=$(node -p "require('./scripts/live-scores/probe-config.json').interval")" >> "$GITHUB_OUTPUT"
            echo "tag=$(node -p "require('./scripts/live-scores/probe-config.json').tag || ''")" >> "$GITHUB_OUTPUT"
          fi

  probe:
    needs: config
    if: needs.config.outputs.mode == 'once' || needs.config.outputs.mode == 'watch'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live-scores
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe (once)
        if: needs.config.outputs.mode == 'once'
        run: node scripts/live-scores/probe.mjs once --out "$RUNNER_TEMP/out"
      - name: Probe (watch), publishing the log every 10 minutes
        if: needs.config.outputs.mode == 'watch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node scripts/live-scores/probe.mjs watch --out "$RUNNER_TEMP/out" --minutes "${{ needs.config.outputs.minutes }}" --interval "${{ needs.config.outputs.interval }}" &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 600; bash scripts/live-scores/publish-branch.sh "$RUNNER_TEMP/out" || true; done
          wait $pid || true
      - name: Publish the report to the live-scores-probe branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/live-scores/publish-branch.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-scores-probe
          path: ${{ runner.temp }}/out
          retention-days: 7

  verify:
    needs: config
    if: needs.config.outputs.mode == 'verify' || needs.config.outputs.mode == 'verify-watch' || needs.config.outputs.mode == 'browser' || needs.config.outputs.mode == 'oracle-test' || needs.config.outputs.mode == 'nba-verify' || needs.config.outputs.mode == 'live-site'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real browsers (Chromium and WebKit) against the built app, real boards and real feeds
        if: needs.config.outputs.mode == 'browser'
        run: |
          npx playwright install --with-deps chromium webkit
          npx vite build --outDir "$RUNNER_TEMP/dist"
          node scripts/e2e-preview.mjs --port 4199 --outDir "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4199/sift-sports-intelligence/ && break; sleep 1; done
          cat "$RUNNER_TEMP/preview.log"
          mkdir -p "$RUNNER_TEMP/out"
          node scripts/live-scores/real-browser.mjs http://localhost:4199/sift-sports-intelligence/ "$RUNNER_TEMP/out"
      - name: Can the NBA's own scoreboard be read from here (oracle test)
        if: needs.config.outputs.mode == 'oracle-test'
        run: |
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/oracle"
          node scripts/live-scores/oracle-nba.mjs "$RUNNER_TEMP/oracle" --once
          cp "$RUNNER_TEMP/oracle/oracle-first.json" "$RUNNER_TEMP/out/"
      - name: The deployed site in real Chromium and WebKit, with real feeds (live-site)
        if: needs.config.outputs.mode == 'live-site'
        run: |
          npx playwright install --with-deps chromium webkit
          mkdir -p "$RUNNER_TEMP/out"
          node scripts/live-scores/real-browser.mjs https://chmoses98.github.io/sift-sports-intelligence/ "$RUNNER_TEMP/out"
      - name: NBA - what SIFT displays against the NBA scoreboard, every 30 s, publishing verdicts every 10 minutes
        if: needs.config.outputs.mode == 'nba-verify'
        env:
          LIVE_NBA: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_BRANCH: live-scores-probe-nba${{ needs.config.outputs.tag }}
          NBA_MINUTES: ${{ needs.config.outputs.minutes }}
          VERIFY_OUT: ${{ runner.temp }}/out
          ORACLE_OUT: ${{ runner.temp }}/oracle
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/oracle"
          npx vitest run tests/live/nbaVerify.test.ts &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 600; bash scripts/live-scores/publish-branch.sh "$RUNNER_TEMP/out" || true; done
          wait $pid || true
      - name: Verify once (production adapters and matcher against the real boards and feeds)
        if: needs.config.outputs.mode == 'verify'
        env:
          LIVE_VERIFY: '1'
          VERIFY_OUT: ${{ runner.temp }}/out/live-verify.json
        run: mkdir -p "$RUNNER_TEMP/out" && npx vitest run tests/live/liveVerify.test.ts
      - name: Verify while games are live (watch), publishing every 10 minutes
        if: needs.config.outputs.mode == 'verify-watch'
        env:
          LIVE_WATCH: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_MINUTES: ${{ needs.config.outputs.minutes }}
          WATCH_INTERVAL: ${{ needs.config.outputs.interval }}
          VERIFY_OUT: ${{ runner.temp }}/out
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npx vitest run tests/live/liveWatch.test.ts &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 600; bash scripts/live-scores/publish-branch.sh "$RUNNER_TEMP/out" || true; done
          wait $pid || true
      - name: Publish the report to the live-scores-probe branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_BRANCH: ${{ (needs.config.outputs.mode == 'browser' || needs.config.outputs.mode == 'live-site') && format('live-scores-probe-{0}', needs.config.outputs.mode) || needs.config.outputs.mode == 'nba-verify' && format('live-scores-probe-nba{0}', needs.config.outputs.tag) || 'live-scores-probe' }}
        run: bash scripts/live-scores/publish-branch.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-scores-verify
          path: ${{ runner.temp }}/out
          retention-days: 7
