name: Player images

# Review assets for the Game Script cards: contact sheets for unpinned players, then the pinned free-licence
# Commons photos (credited) under public/players/nfl/ + src/lib/player-images.json. Never fetched at runtime.
on:
  push:
    branches-ignore: [main, live-quotes]
    paths:
      - scripts/players/**
      - .github/workflows/player-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y imagemagick webp fonts-dejavu-core
      - run: node scripts/players/fetch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/players src/lib/player-images.json curation 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Player review images / contact sheets (Wikimedia Commons, free licences)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
