name: Production check

# After every Pages deploy (and on demand): the live site, in real Chromium and WebKit, with live quotes
# from the feed — no fixtures. Read-only. A failure here means production differs from what CI proved.
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 2026-10-22: this step once stalled for 33 minutes (apt/CDN) and the job timeout then cancelled the live-site check before it ran. The
      # browsers are cached per Playwright version and each attempt is bounded and retried, so a stalled mirror costs minutes, not the run.
      # The checks themselves are unchanged.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install Chromium and WebKit (patient first attempt, then one retry)
        timeout-minutes: 65
        run: |
          # 2026-10-23: the apt mirror was throttled (about 45 KB/s for 119 MB of system packages), and three 240 s attempts all gave up, so the
          # live-site checks ran without a browser. A slow mirror needs about 45 minutes in one go; a genuine hang (33 minutes seen earlier) is
          # still bounded. `timeout` cannot stop the root-owned apt-get that `playwright install --with-deps` starts through sudo: it keeps the
          # dpkg lock and every later attempt then fails instantly ("Could not get lock"), so a stalled apt is cleared before the one retry.
          clear_apt() {
            sudo pkill -x apt-get || true; sudo pkill -x apt || true
            for _ in $(seq 1 60); do pgrep -x dpkg >/dev/null || break; sleep 5; done
            sudo dpkg --configure -a || true
          }
          if timeout 2700 npx playwright install --with-deps chromium webkit; then exit 0; fi
          echo "install attempt 1 failed or stalled (45 min limit); clearing apt and retrying once"; clear_apt; sleep 10
          if timeout 900 npx playwright install --with-deps chromium webkit; then exit 0; fi
          echo "Playwright could not be installed"; exit 1
      - name: Check the live site (Chromium phone + WebKit iPhone)
        run: node scripts/production-check.mjs
        env:
          # When the owner has configured the Kalshi relay, production must prove it is the live source.
          SIFT_EXPECT_RELAY: ${{ vars.SIFT_QUOTE_RELAY_URL != '' && '1' || '0' }}
          # Probed directly too, so a relay failure is reported with its HTTP status and CORS headers.
          SIFT_QUOTE_RELAY_URL: ${{ vars.SIFT_QUOTE_RELAY_URL }}
      - name: CFB — the live Script Engine path and team logos (Chromium phone + WebKit iPhone)
        if: always()
        run: node scripts/cfb-production-check.mjs
        env:
          # After a deploy, the site must be serving exactly the commit that was deployed (version.json).
          SIFT_EXPECT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      - name: NFL — the published projection distribution in the live Explorer (Chromium desktop + WebKit iPhone)
        if: always()
        run: node scripts/nfl-distribution-production-check.mjs
      # SIFT v4 early access (opt-in at #/v4): the journey Home, Games, Game, Props, Research, Save, Board, revisit on the live site with real
      # data, the price ages against the quote feed's own times, SIFT 2.0 still the default, and a returning visit. When the pause switch
      # (repository variable SIFT_V4=off) is set it checks only that v4 says so and SIFT 2.0 is untouched. Screenshots: production-v4-*.png.
      - name: SIFT v4 early access (Chromium phone + WebKit iPhone)
        if: always()
        run: node scripts/v4-production-check.mjs
        env:
          SIFT_V4_PAUSED: ${{ vars.SIFT_V4 == 'off' && '1' || '0' }}
          SIFT_EXPECT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      # v4 CFB and NBA projections on the live site: every number on the phone equals the published feed row (cfb-edge-finder / nba-edge-finder
      # projection-data), with the quality labels, exclusions and one projection per player and stat. Screenshots: production-v4-projections-*.png.
      - name: SIFT v4 CFB and NBA projections (Chromium phone + WebKit iPhone)
        if: always()
        run: node scripts/v4-projections-production-check.mjs
        env:
          SIFT_EXPECT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      # The repair sprint's deliverables (docs/REPAIR_SPRINT_2026-10-11.md) on the live site: every line names its
      # tracker issue; a check that cannot apply today prints N/A (reason). Screenshots: production-sprint-*.png.
      - name: Sprint features (repair sprint 2026-10-11)
        if: always()
        run: node scripts/sprint-production-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-check
          path: production-*.png
          retention-days: 14

  # Measured rate-limit evidence from the configured relay, after the browser check (never overlapping it).
  relay-smoke:
    needs: check
    if: always() && vars.SIFT_QUOTE_RELAY_URL != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure the relay (1 · 10 sequential · 20 burst · 100-ticker batches · 3-game cycle)
        run: node scripts/relay-smoke.mjs
        env:
          RELAY_URL: ${{ vars.SIFT_QUOTE_RELAY_URL }}
      # Control: the same pattern straight to Kalshi from this runner (no Origin), so a 429 can be
      # attributed to the relay's host network or to Kalshi itself. Recorded, never fails the run.
      - name: Control — Kalshi directly from this runner
        if: always()
        run: node scripts/relay-smoke.mjs
        env:
          RELAY_URL: https://api.elections.kalshi.com/trade-api/v2
          DIRECT: '1'
          ALLOW_FAIL: '1'
