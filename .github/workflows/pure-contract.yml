name: PURE contract gate

# Separate from ci.yml on purpose: ci.yml is reused by deploy.yml, and this research-only
# gate must never block a SIFT deploy.
on:
  pull_request:
    paths:
      - 'pure-contract/**'
      - '.github/workflows/pure-contract.yml'
  push:
    branches: [main]
    paths:
      - 'pure-contract/**'
      - '.github/workflows/pure-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-contract:
    name: PURE contract gate (Python, stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (schema, lineage, ladders, compare, rerun non-leakage with toy models)
        working-directory: pure-contract
        run: python -I -m unittest discover -s tests -v
      - name: Validate example sidecars (v1 and kit interim v0)
        working-directory: pure-contract
        run: |
          python -I pure_gate.py validate --forecasts examples/pure_forecast.v1.example.jsonl --require-v1
          python -I pure_gate.py validate --forecasts examples/kit_interim_v0.example.jsonl
      - name: Prop explorer examples (validate; rebuild byte-for-byte from real research sources)
        working-directory: pure-contract
        run: |
          for f in examples/prop_explorer/sources/*.v1.jsonl; do
            python -I pure_gate.py validate --forecasts "$f" --require-v1 > /dev/null
          done
          for s in mlb nfl nba; do
            python -I prop_explorer.py validate --projections "examples/prop_explorer/$s.prop_explorer_projection.v1.jsonl"
          done
          python -I examples/prop_explorer/build_examples.py --check

  prop-explorer-types:
    name: Prop explorer TypeScript declarations (tsc --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check the declarations (no app build, no npm ci)
        run: npx --yes -p typescript@5.9.3 tsc --noEmit --strict pure-contract/types/prop_explorer_projection.v1.d.ts
