name: Relay production verification

# Read-only proof of the deployed quote relay and of what the deployed app does with it (relay-production-verify.mjs: market reads, freshness,
# CORS and a browser-readable Date in Chromium and WebKit, 429 and fallback; v3-quote-production-check.mjs: SIFT 3.0 prices and contract sheet).
# On demand, and on a pull request that changes these two scripts. It does not publish, deploy or write anything.
on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: 'Commit the live site must be serving (empty = any)'
        required: false
        default: ''
  pull_request:
    paths:
      - scripts/relay-production-verify.mjs
      - scripts/v3-quote-production-check.mjs
      - scripts/v3-production-check.mjs
      - .github/workflows/relay-production-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        timeout-minutes: 45
        run: npx playwright install --with-deps chromium webkit
      - name: Deployed relay, from Sift's origin in Chromium and WebKit
        if: always()
        run: node scripts/relay-production-verify.mjs
        env:
          SIFT_QUOTE_RELAY_URL: ${{ vars.SIFT_QUOTE_RELAY_URL }}
      - name: SIFT 3.0 quotes and priced contracts (desktop and iPhone size)
        if: always()
        run: node scripts/v3-quote-production-check.mjs
      - name: SIFT 3.0 is the default; Home / Props / Following, game and Back, CFB Script Engine (Chromium phone + WebKit iPhone)
        if: always()
        run: node scripts/v3-production-check.mjs
        env:
          SIFT_EXPECT_SHA: ${{ inputs.expect_sha }}
