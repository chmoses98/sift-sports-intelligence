name: Repro iPhone SE Board Remove (temporary)

# Temporary diagnostic, never merged: runs the v4 Board smoke tests on WebKit iPhone SE many times, on main as it is ("baseline") and with the
# Board-at-rest change from claude/board-tap-at-rest ("at-rest"), so the Remove-button failure and its tap telemetry can be read from the log.
on:
  push:
    branches: ['claude/repro-se-board']

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        variant: [telemetry-a, telemetry-b]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Use main plus the tap telemetry (no behaviour change)
        run: git checkout origin/claude/board-tap-telemetry -- e2e
      - run: npm run build:e2e
      - name: Install Chromium and WebKit
        timeout-minutes: 80
        run: timeout 4500 npx playwright install --with-deps chromium webkit
      - name: Board smoke on iPhone SE, repeated
        run: |
          set +e
          npx playwright test e2e/v4-board.spec.ts --project=iphone-se --repeat-each=24 --workers=4 --reporter=list > out.txt 2>&1
          echo "exit: $?"
          grep -cE '^\s+✘' out.txt | sed 's/^/failed results: /'
          echo '---- failure blocks (with tap logs) ----'
          grep -B1 -A62 '^tap log' out.txt | head -900
          echo '---- summary ----'
          tail -12 out.txt
        env: { CI: 'true' }
