name: Stadium candidates

# Curation aid: renders numbered contact sheets of free-licence, high-resolution Commons photos per
# venue under curation/stadiums/ so a person can pin the best frame in scripts/stadiums/venues.json.
on:
  push:
    branches-ignore: [main, live-quotes]
    paths:
      - scripts/stadiums/candidates.mjs
      - .github/workflows/stadium-candidates.yml
  workflow_dispatch:
    inputs:
      only:
        description: Venue slugs (comma-separated, optional)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: stadium-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu-core
      - run: node scripts/stadiums/candidates.mjs
        env:
          ONLY: ${{ inputs.only }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curation
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Stadium curation contact sheets (not used by the app)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
