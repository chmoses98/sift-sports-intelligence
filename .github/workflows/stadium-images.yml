name: Stadium images

# Fetches Wikimedia Commons photographs PROPOSED in scripts/stadiums/photos.json (status candidate, no
# files yet) and commits their derivatives under curation/stadiums/candidates/ with the provenance the
# Commons API states. Nothing is approved or served by this workflow: approval is the owner's, and an
# approved photo's files are never re-fetched. The app never fetches an image at runtime.
# ONLY limits it to some photo ids or venue slugs, comma-separated.
on:
  push:
    branches-ignore: [main, live-quotes]
    paths:
      - scripts/stadiums/**
      - .github/workflows/stadium-images.yml
  workflow_dispatch:
    inputs:
      only:
        description: Photo ids or venue slugs to fetch (comma-separated, optional)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: stadium-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ImageMagick with WebP
        run: |
          convert -version | head -1
          convert -list format | grep -i webp || (sudo apt-get update && sudo apt-get install -y webp imagemagick)
      - name: Fetch images
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/stadiums/fetch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stadiums/photos.json curation/stadiums/candidates
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Stadium photo candidates from Wikimedia Commons (owner review required)"
          git push
