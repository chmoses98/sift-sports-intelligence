name: Team logos

# Fetches NFL team logos once (ESPN's public logo CDN) and commits them under public/teams/nfl/ with
# src/lib/team-logos.json; CBB team identity (colors + logos for every D-I team in the CBB publication)
# under public/teams/cbb/ with src/lib/cbb-teams.json; NHL logos (all 32 clubs, NHL's own SVGs) under public/teams/nhl/ with
# src/lib/nhl-team-logos.json; CFB team identity (contract team code -> ESPN team id, from the
# CFB publication's identity-verified games) and logos under public/teams/cfb/ with src/lib/cfb-teams.json; MLB club
# logos (all 30) under public/teams/mlb/ with src/lib/mlb-team-logos.json.
# The app never fetches a logo from a third party at runtime.
on:
  push:
    branches-ignore: [main, live-quotes]
    paths:
      - scripts/teams/**
      - .github/workflows/team-logos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-logos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: convert -list format | grep -i webp || (sudo apt-get update && sudo apt-get install -y webp imagemagick)
      - run: command -v rsvg-convert || (sudo apt-get update && sudo apt-get install -y librsvg2-bin)
      - run: node scripts/teams/fetch-logos.mjs
      - run: node scripts/teams/fetch-nhl-logos.mjs
      - run: node scripts/teams/fetch-mlb-logos.mjs
      - run: node scripts/teams/fetch-leagues.mjs
      - run: node scripts/teams/fetch-cbb-teams.mjs
      - run: node scripts/teams/fetch-cfb-teams.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/teams public/leagues src/lib/team-logos.json src/lib/nhl-team-logos.json src/lib/mlb-team-logos.json src/lib/league-logos.json src/lib/cbb-teams.json src/lib/cfb-teams.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Team and league logos (fetched once from ESPN's logo CDN)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
