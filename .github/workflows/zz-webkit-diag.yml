name: TEMP WebKit reload diagnostic
on:
  push:
    branches: [claude/sift-qa-live-market-mn7bzf]
    paths: [e2e/zz-webkit-reload.spec.ts, .github/workflows/zz-webkit-diag.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build:e2e
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test e2e/zz-webkit-reload.spec.ts --project=iphone --grep @diag --reporter=list || true
        env: { CI: 'true' }
