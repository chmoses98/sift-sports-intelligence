<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sift · Sports Intelligence</title>
    <meta name="description" content="Sift Sports Intelligence: explore teams, players, games, metrics, rankings and markets as one connected research web. Projections are evidence, not bets." />
    <meta name="theme-color" content="#05070d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sift" />
    <link rel="icon" href="icons/sift.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <script>
      /* Opened on #/v4: this page installs as its own Home Screen app, "SIFT v4", which launches v4 (src/lib/installIdentity.ts keeps it
         right as the address changes in the app). Runs here, not in the head: the build adds the manifest link at the end of the head.
         On any other address nothing changes. */
      (function () {
        try {
          if (!/^#\/v4(?:[\/?]|$)|[?&]ui=v4(?:&|$)/.test(location.hash + location.search)) return;
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute('href', link.getAttribute('href').replace(/manifest\.webmanifest$/, 'manifest-v4.webmanifest'));
          var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (title) title.setAttribute('content', 'SIFT v4');
          document.title = 'SIFT v4 \u00b7 early access';
        } catch (e) { /* the page still works as SIFT */ }
      })();
    </script>
    <div id="root"><!-- Replaced when the app starts. This is the page a crawler that does not run scripts sees: the credit SportScore's free tier asks for, as a plain, visible, followable link. -->
      <p data-static-credit style="margin:0;padding:12px 16px;font:14px system-ui,-apple-system,sans-serif;color:#aab4c3">Live scores, when switched on: <a href="https://sportscore.com/" rel="dofollow" title="Sports data by SportScore" style="color:#cfd8e6">Powered by SportScore</a></p>
    </div>
    <noscript>Sift needs JavaScript: it reads the published research files directly in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
