<title>Sift quote relay</title>
<p>Sift's read-only Kalshi quote relay. It answers only <code>GET /markets</code> with <code>tickers</code>, <code>event_ticker</code> or <code>series_ticker</code>, for Sift's own origins. Source: <a href="https://github.com/chmoses98/sift-sports-intelligence/tree/main/relay">github.com/chmoses98/sift-sports-intelligence/relay</a>.</p>
